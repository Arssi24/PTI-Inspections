<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Today</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json" />
</head>
<body>

<div class="screen">
  <div class="container" style="padding-bottom:100px">

    <div class="dash-header">
      <div>
        <div class="dash-greeting" id="greeting">Today</div>
        <div class="dash-date" id="dateLabel"></div>
      </div>
      <div class="streak-badge">🔥 <span id="streakCount">0</span></div>
    </div>

    <div class="ring-card">
      <svg width="180" height="180" viewBox="0 0 180 180">
        <circle cx="90" cy="90" r="78" fill="none" stroke="#ececee" stroke-width="14" />
        <circle id="calorieRing" cx="90" cy="90" r="78" fill="none" stroke="#14151a" stroke-width="14"
          stroke-linecap="round" transform="rotate(-90 90 90)" stroke-dasharray="490" stroke-dashoffset="490" />
        <text x="90" y="84" text-anchor="middle" font-size="30" font-weight="800" fill="#14151a" id="ringCalorieText">0</text>
        <text x="90" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#6b6d76">of <tspan id="ringTargetText">0</tspan> cal</text>
      </svg>
      <div class="ring-remaining" id="remainingText"><b>0</b> calories left today</div>
    </div>

    <div class="sub-rings">
      <div class="sub-ring-card">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="24" fill="none" stroke="#ececee" stroke-width="6" />
          <circle id="proteinRing" cx="28" cy="28" r="24" fill="none" stroke="#4c6fff" stroke-width="6"
            stroke-linecap="round" transform="rotate(-90 28 28)" stroke-dasharray="151" stroke-dashoffset="151" />
        </svg>
        <div class="macro-name">Protein</div>
        <div class="macro-nums" id="proteinNums">0 / 0g</div>
      </div>
      <div class="sub-ring-card">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="24" fill="none" stroke="#ececee" stroke-width="6" />
          <circle id="carbsRing" cx="28" cy="28" r="24" fill="none" stroke="#ff9f43" stroke-width="6"
            stroke-linecap="round" transform="rotate(-90 28 28)" stroke-dasharray="151" stroke-dashoffset="151" />
        </svg>
        <div class="macro-name">Carbs</div>
        <div class="macro-nums" id="carbsNums">0 / 0g</div>
      </div>
      <div class="sub-ring-card">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="24" fill="none" stroke="#ececee" stroke-width="6" />
          <circle id="fatRing" cx="28" cy="28" r="24" fill="none" stroke="#ff5c8a" stroke-width="6"
            stroke-linecap="round" transform="rotate(-90 28 28)" stroke-dasharray="151" stroke-dashoffset="151" />
        </svg>
        <div class="macro-name">Fat</div>
        <div class="macro-nums" id="fatNums">0 / 0g</div>
      </div>
    </div>

    <div class="section-title">Today's Log</div>
    <div id="mealGroups"></div>

  </div>
</div>

<button class="fab" id="addFoodFab" aria-label="Add food">+</button>

<!-- Manual entry modal -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Add Food</div>

    <div class="field-group">
      <label class="field-label">Food name</label>
      <input class="field-input" type="text" id="mFoodName" placeholder="Grilled chicken breast" />
    </div>

    <div class="field-group">
      <label class="field-label">Meal</label>
      <select class="field-input" id="mMealType">
        <option value="breakfast">Breakfast</option>
        <option value="lunch">Lunch</option>
        <option value="dinner">Dinner</option>
        <option value="snacks">Snacks</option>
      </select>
    </div>

    <div class="field-group">
      <label class="field-label">Serving size</label>
      <input class="field-input" type="text" id="mServing" placeholder="1 cup, 200g, etc." />
    </div>

    <div class="field-row">
      <div class="field-group" style="flex:1">
        <label class="field-label">Calories</label>
        <input class="field-input" type="number" id="mCalories" placeholder="0" />
      </div>
    </div>
    <div class="field-row">
      <div class="field-group" style="flex:1">
        <label class="field-label">Protein (g)</label>
        <input class="field-input" type="number" id="mProtein" placeholder="0" />
      </div>
      <div class="field-group" style="flex:1">
        <label class="field-label">Carbs (g)</label>
        <input class="field-input" type="number" id="mCarbs" placeholder="0" />
      </div>
      <div class="field-group" style="flex:1">
        <label class="field-label">Fat (g)</label>
        <input class="field-input" type="number" id="mFat" placeholder="0" />
      </div>
    </div>

    <button class="btn-primary" id="mSaveBtn">Log It</button>
    <button class="btn-secondary" id="mCancelBtn">Cancel</button>
  </div>
</div>

<script src="js/calculations.js"></script>
<script src="js/storage.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
